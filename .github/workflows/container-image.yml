name: Release container images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit to build, used to publish a previous rollback image
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: release-containers-${{ github.event.workflow_run.head_sha || inputs.source_ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable backend, Admin Web, and operations images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the approved publication controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out the exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          if [[ ! "$short_sha" =~ ^[0-9a-f]{7}$ ]]; then
            printf 'Unexpected commit short hash: %s\n' "$short_sha" >&2
            exit 1
          fi
          {
            printf 'full_sha=%s\n' "$full_sha"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'name=ghcr.io/%s/taptime-backend-api\n' "${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify successful exact-commit CI for a manual rollback build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.image.outputs.full_sha }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "head_sha=$SOURCE_SHA" \
            -f status=success \
            -f per_page=1 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | length')"
          if [[ "$successful_runs" != '1' ]]; then
            printf 'No successful CI run exists for exact commit %s.\n' "$SOURCE_SHA" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a conflicting mutable backend tag
        id: backend_existing
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
          EXPECTED_REVISION: ${{ steps.image.outputs.full_sha }}
        run: |
          set -euo pipefail
          set +e
          pull_output="$(docker pull "$IMAGE" 2>&1)"
          pull_status=$?
          set -e
          if (( pull_status != 0 )); then
            if ! grep --extended-regexp --quiet 'manifest unknown|not found' <<<"$pull_output"; then
              printf '%s\n' "$pull_output" >&2
              printf 'Could not prove that immutable tag %s is absent.\n' "$IMAGE" >&2
              exit 1
            fi
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$IMAGE")"
          if [[ "$actual_revision" != "$EXPECTED_REVISION" ]]; then
            printf 'Tag %s already names revision %s, expected %s.\n' \
              "$IMAGE" "$actual_revision" "$EXPECTED_REVISION" >&2
            exit 1
          fi
          printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          printf 'Immutable backend image already exists; it will not be rebuilt.\n'

      - name: Refuse a conflicting mutable Admin Web tag
        id: admin_web_existing
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:admin-web-${{ steps.image.outputs.short_sha }}
          EXPECTED_REVISION: ${{ steps.image.outputs.full_sha }}
        run: |
          set -euo pipefail
          set +e
          pull_output="$(docker pull "$IMAGE" 2>&1)"
          pull_status=$?
          set -e
          if (( pull_status != 0 )); then
            if ! grep --extended-regexp --quiet 'manifest unknown|not found' <<<"$pull_output"; then
              printf '%s\n' "$pull_output" >&2
              printf 'Could not prove that immutable tag %s is absent.\n' "$IMAGE" >&2
              exit 1
            fi
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$IMAGE")"
          if [[ "$actual_revision" != "$EXPECTED_REVISION" ]]; then
            printf 'Tag %s already names revision %s, expected %s.\n' \
              "$IMAGE" "$actual_revision" "$EXPECTED_REVISION" >&2
            exit 1
          fi
          printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          printf 'Immutable Admin Web image already exists; it will not be rebuilt.\n'

      - name: Refuse a conflicting mutable operations tag
        id: operations_existing
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:operations-${{ steps.image.outputs.short_sha }}
          EXPECTED_REVISION: ${{ steps.image.outputs.full_sha }}
        run: |
          set -euo pipefail
          set +e
          pull_output="$(docker pull "$IMAGE" 2>&1)"
          pull_status=$?
          set -e
          if (( pull_status != 0 )); then
            if ! grep --extended-regexp --quiet 'manifest unknown|not found' <<<"$pull_output"; then
              printf '%s\n' "$pull_output" >&2
              printf 'Could not prove that immutable tag %s is absent.\n' "$IMAGE" >&2
              exit 1
            fi
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$IMAGE")"
          if [[ "$actual_revision" != "$EXPECTED_REVISION" ]]; then
            printf 'Tag %s already names revision %s, expected %s.\n' \
              "$IMAGE" "$actual_revision" "$EXPECTED_REVISION" >&2
            exit 1
          fi
          printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          printf 'Immutable operations image already exists; it will not be rebuilt.\n'

      - name: Fetch the production rollback protection set
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            --header 'Cache-Control: no-cache' \
            https://admin.tb-infra.de/status/ghcr-protected-versions.json \
            > "$RUNNER_TEMP/ghcr-protected-versions.json"

      - name: Remove obsolete unprotected release images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PUBLISH_BACKEND_IMAGE: ${{ steps.backend_existing.outputs.publish }}
          PUBLISH_ADMIN_WEB_IMAGE: ${{ steps.admin_web_existing.outputs.publish }}
          PUBLISH_OPERATIONS_IMAGE: ${{ steps.operations_existing.outputs.publish }}
        run: |
          set -euo pipefail
          package='taptime-backend-api'
          versions_file="$RUNNER_TEMP/ghcr-package-versions.json"
          api_path="/users/$PACKAGE_OWNER/packages/container/$package"
          error_file="$RUNNER_TEMP/ghcr-package-error.log"
          new_image_count=0

          if [[ "$PUBLISH_BACKEND_IMAGE" == 'true' ]]; then
            new_image_count=$((new_image_count + 1))
          fi
          if [[ "$PUBLISH_ADMIN_WEB_IMAGE" == 'true' ]]; then
            new_image_count=$((new_image_count + 1))
          fi
          if [[ "$PUBLISH_OPERATIONS_IMAGE" == 'true' ]]; then
            new_image_count=$((new_image_count + 1))
          fi

          if gh api "$api_path" >/dev/null 2>"$error_file"; then
            gh api --paginate --slurp "$api_path/versions?per_page=100" > "$versions_file"
          elif (( new_image_count > 0 )) &&
            grep --fixed-strings --quiet 'HTTP 404' "$error_file"; then
            printf '[]\n' > "$versions_file"
          else
            cat "$error_file" >&2
            printf 'Could not inspect GHCR package; refusing publication.\n' >&2
            exit 1
          fi

          keep_existing=$((20 - new_image_count))
          node control/.github/scripts/select-ghcr-deletions.mjs \
            "$RUNNER_TEMP/ghcr-protected-versions.json" \
            "$versions_file" \
            "$keep_existing" > "$RUNNER_TEMP/ghcr-delete-ids"

          while IFS= read -r version_id; do
            [[ -n "$version_id" ]] || continue
            printf 'Deleting obsolete unprotected GHCR package version %s.\n' "$version_id"
            gh api --method DELETE "$api_path/versions/$version_id"
          done < "$RUNNER_TEMP/ghcr-delete-ids"

      - name: Build and publish the backend image once
        if: steps.backend_existing.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/infrastructure/backend-api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish the Admin Web image once
        if: steps.admin_web_existing.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: source
          file: control/infrastructure/admin-web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:admin-web-${{ steps.image.outputs.short_sha }}
          build-args: |
            TAPTIME_VERSION=${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish the operations image once
        if: steps.operations_existing.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: source
          file: control/infrastructure/operations/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:operations-${{ steps.image.outputs.short_sha }}
          build-args: |
            TAPTIME_VERSION=${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
