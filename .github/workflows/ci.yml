        run: npm run typecheck --workspace=@taptime/backend-api

      - name: Test focused DA2 HTTP export boundary
        run: npm test --workspace=@taptime/backend-api -- --run tests/TimeEntryExportApi.test.ts

  backend-da3-time-review:
    name: Backend DA3 append-only correction and Human review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: taptime_da3
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: taptime_da3_installer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taptime_da3_installer -d taptime_da3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      B3_DATABASE_URL: postgresql://taptime_da3_installer:postgres@127.0.0.1:5432/taptime_da3
      DA2_DATABASE_URL: postgresql://taptime_da3_installer:postgres@127.0.0.1:5432/taptime_da3
      DA3_DATABASE_URL: postgresql://taptime_da3_installer:postgres@127.0.0.1:5432/taptime_da3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build DA3 contracts and backend dependencies
        run: |
          npm run build --workspace=@taptime/administration-contract
          npm run build --workspace=@taptime/mobile-work-contract
          npm run build --workspace=@taptime/offline-sync-contract
          npm run build --workspace=@taptime/time-entry-export-contract
          npm run build --workspace=@taptime/time-review-contract
          npm run build --workspace=@taptime/core
          npm run build --workspace=@taptime/backend-schema
          npm run build --workspace=@taptime/backend-identity
          npm run build --workspace=@taptime/backend-mobile-work
          npm run build --workspace=@taptime/backend-read-model
          npm run build --workspace=@taptime/backend-lifecycle
          npm run build --workspace=@taptime/backend-administration
          npm run build --workspace=@taptime/backend-bootstrap
          npm run build --workspace=@taptime/backend-offline-sync
          npm run build --workspace=@taptime/backend-time-review

      - name: Typecheck and test the neutral DA3 contract
        run: |
          npm run typecheck --workspace=@taptime/time-review-contract
          npm test --workspace=@taptime/time-review-contract

      - name: Apply, replay, and verify schema migrations 001 through 013
        run: |
          npm run migrate --workspace=@taptime/backend-schema
          npm run migrate --workspace=@taptime/backend-schema
          npm run verify-migrations --workspace=@taptime/backend-schema

      - name: Typecheck and test append-only correction and Human review
        run: |
          npm run typecheck --workspace=@taptime/backend-time-review
          npm test --workspace=@taptime/backend-time-review

      - name: Typecheck and test DA3 effective export and end-to-end journey
        run: |
          npm run typecheck --workspace=@taptime/backend-time-export
          npm test --workspace=@taptime/backend-time-export

      - name: Test focused DA3 HTTP boundary
        run: npm test --workspace=@taptime/backend-api -- --run tests/TimeReviewApi.test.ts

      - name: Build DA3 runtime packages
        run: |
          npm run build --workspace=@taptime/backend-time-export
          npm run build --workspace=@taptime/backend-api

  synthetic-android-e2e:
    name: Synthetic server-connected Android E2E harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start exact-owned loopback-only PostgreSQL 17
        id: postgres_owner
        run: |
          set -euo pipefail
          read_linux_process_start_ticks() {
            local expected_pid="$1"
            local stat_record
            local stat_tail
            local -a stat_fields
            [[ "${expected_pid}" =~ ^[1-9][0-9]*$ ]]
            stat_record="$(<"/proc/${expected_pid}/stat")"
            [[ "${stat_record}" != *$'\n'* ]]
            [[ "${stat_record}" == "${expected_pid} ("?*") "* ]]
            stat_tail="${stat_record##*) }"
            test "${stat_tail}" != "${stat_record}"
            read -r -a stat_fields <<<"${stat_tail}"
            test "${#stat_fields[@]}" -ge 20
            [[ "${stat_fields[0]}" =~ ^[[:alpha:]]$ ]]
            [[ "${stat_fields[19]}" =~ ^[1-9][0-9]*$ ]]
            printf '%s\n' "${stat_fields[19]}"
          }
          owner_root="${RUNNER_TEMP}/taptime-da5-v5-postgres"
          install -d -m 700 "${owner_root}"
          nonce="$(openssl rand -hex 32)"
          password="$(openssl rand -hex 32)"
          name="taptime-da5-v5-synthetic-android-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${nonce}"
          echo "::add-mask::${password}"
          docker pull postgres:17.10-alpine
          image_id="$(docker image inspect postgres:17.10-alpine --format '{{.Id}}')"
          image_digest="$(docker image inspect postgres:17.10-alpine \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk '/^postgres@sha256:[a-f0-9]{64}$/ { print; exit }')"
          test "${image_id}" != ""
          test "${image_digest}" != ""
          printf '%s\n%s\n' "${nonce}" "${image_digest}" > "${owner_root}/binding"
          chmod 600 "${owner_root}/binding"
          docker run --detach \
            --cidfile "${owner_root}/cid" \
            --name "${name}" \
            --network host \
            --env POSTGRES_DB=taptime_synthetic_android_e2e \
            --env "POSTGRES_PASSWORD=${password}" \
            --env POSTGRES_USER=postgres \
            --label com.taptime.repository=taptime \
            --label "com.taptime.run-id=${GITHUB_RUN_ID}" \
            --label "com.taptime.run-attempt=${GITHUB_RUN_ATTEMPT}" \
            --label com.taptime.job=synthetic-android-e2e \
            --label "com.taptime.nonce=${nonce}" \
            "${image_digest}" \
            -c listen_addresses=127.0.0.1
          cid="$(tr -d '\\n' < "${owner_root}/cid")"
          test "$(printf '%s' "${cid}" | wc -c | tr -d ' ')" = "64"
          for attempt in {1..30}; do
            if docker exec "${cid}" \
              pg_isready -U postgres -d taptime_synthetic_android_e2e; then
              break
            fi
            test "${attempt}" != "30"
            sleep 1
          done
          started_at="$(docker inspect "${cid}" --format '{{.State.StartedAt}}')"
          host_pid="$(docker inspect "${cid}" --format '{{.State.Pid}}')"
          host_process_start_ticks="$(read_linux_process_start_ticks "${host_pid}")"
          inner_system_id="$(docker exec "${cid}" psql \
            --username postgres \
            --dbname taptime_synthetic_android_e2e \
            --tuples-only --no-align \
            --command 'SELECT system_identifier FROM pg_catalog.pg_control_system()')"
          database_url="postgresql://postgres:${password}@127.0.0.1:5432/taptime_synthetic_android_e2e"
          jq -n \
            --arg containerId "${cid}" \
            --argjson hostInitPid "${host_pid}" \
            --arg hostProcessStartTicks "${host_process_start_ticks}" \
            --arg imageId "${image_id}" \
            --arg imageRepositoryDigest "${image_digest}" \
            --arg innerSystemIdentifier "${inner_system_id}" \
            --arg startedAt "${started_at}" \
            --arg repository taptime \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg job synthetic-android-e2e \
            --arg nonce "${nonce}" \
            '{
              containerId: $containerId,
              hostInitPid: $hostInitPid,
              hostProcessStartTicks: $hostProcessStartTicks,
              imageId: $imageId,
              imageRepositoryDigest: $imageRepositoryDigest,
              innerSystemIdentifier: $innerSystemIdentifier,
              labels: {
                "com.taptime.repository": $repository,
                "com.taptime.run-id": $runId,
                "com.taptime.run-attempt": $runAttempt,
                "com.taptime.job": $job,
                "com.taptime.nonce": $nonce
              },
              startedAt: $startedAt
            }' > "${owner_root}/owner.json"
          chmod 600 "${owner_root}/owner.json"
          printf 'database_url=%s\n' "${database_url}" >> "${GITHUB_OUTPUT}"
          printf 'owner_record=%s\n' "${owner_root}/owner.json" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build synthetic harness type dependencies
        run: |
          npm run build --workspace=@taptime/administration-contract
          npm run build --workspace=@taptime/mobile-work-contract
          npm run build --workspace=@taptime/offline-sync-contract
          npm run build --workspace=@taptime/time-entry-export-contract
          npm run build --workspace=@taptime/time-review-contract
          npm run build --workspace=@taptime/core
          npm run build --workspace=@taptime/backend-schema
          npm run build --workspace=@taptime/backend-identity
          npm run build --workspace=@taptime/backend-mobile-work
          npm run build --workspace=@taptime/backend-read-model
          npm run build --workspace=@taptime/backend-lifecycle
          npm run build --workspace=@taptime/backend-administration
          npm run build --workspace=@taptime/backend-time-export
          npm run build --workspace=@taptime/backend-offline-sync
          npm run build --workspace=@taptime/backend-time-review
          npm run build --workspace=@taptime/backend-api

      - name: Typecheck synthetic Android E2E harness
        run: npm run typecheck --workspace=@taptime/synthetic-android-e2e

      - name: Test synthetic Android E2E harness against clean PostgreSQL 17
        env:
          TAPTIME_DA5_V5_CI_OWNER_RECORD: ${{ steps.postgres_owner.outputs.owner_record }}
          TAPTIME_SYNTHETIC_E2E_DATABASE_URL: ${{ steps.postgres_owner.outputs.database_url }}
        run: npm test --workspace=@taptime/synthetic-android-e2e

      - name: Build synthetic Android E2E harness
        run: npm run build --workspace=@taptime/synthetic-android-e2e

      - name: Stop exact-owned synthetic PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          read_linux_process_start_ticks() {
            local expected_pid="$1"
            local stat_record
            local stat_tail
            local -a stat_fields
            [[ "${expected_pid}" =~ ^[1-9][0-9]*$ ]]
            stat_record="$(<"/proc/${expected_pid}/stat")"
            [[ "${stat_record}" != *$'\n'* ]]
            [[ "${stat_record}" == "${expected_pid} ("?*") "* ]]
            stat_tail="${stat_record##*) }"
            test "${stat_tail}" != "${stat_record}"
            read -r -a stat_fields <<<"${stat_tail}"
            test "${#stat_fields[@]}" -ge 20
            [[ "${stat_fields[0]}" =~ ^[[:alpha:]]$ ]]
            [[ "${stat_fields[19]}" =~ ^[1-9][0-9]*$ ]]
            printf '%s\n' "${stat_fields[19]}"
          }
          owner_root="${RUNNER_TEMP}/taptime-da5-v5-postgres"
          if ! test -f "${owner_root}/cid"; then
            residue="$(docker ps --all --quiet \
              --filter label=com.taptime.repository=taptime \
              --filter "label=com.taptime.run-id=${GITHUB_RUN_ID}" \
              --filter "label=com.taptime.run-attempt=${GITHUB_RUN_ATTEMPT}" \
              --filter label=com.taptime.job=synthetic-android-e2e)"
            test -z "${residue}"
            exit 0
          fi

          cid="$(tr -d '\\n' < "${owner_root}/cid")"
          test "$(printf '%s' "${cid}" | wc -c | tr -d ' ')" = "64"
          test -f "${owner_root}/binding"
          test -f "${owner_root}/owner.json"
          nonce="$(sed -n '1p' "${owner_root}/binding")"
          image_digest="$(sed -n '2p' "${owner_root}/binding")"
          test "$(jq -r '.containerId' "${owner_root}/owner.json")" = "${cid}"
          test "$(jq -r '.imageRepositoryDigest' "${owner_root}/owner.json")" = \
            "${image_digest}"
          if ! inspect="$(docker inspect "${cid}" --format '{{json .}}' 2>/dev/null)"; then
            residue="$(docker ps --all --quiet \
              --filter label=com.taptime.repository=taptime \
              --filter "label=com.taptime.run-id=${GITHUB_RUN_ID}" \
              --filter "label=com.taptime.run-attempt=${GITHUB_RUN_ATTEMPT}" \
              --filter label=com.taptime.job=synthetic-android-e2e \
              --filter "label=com.taptime.nonce=${nonce}")"
            test -z "${residue}"
            exit 0
          fi
          image_id="$(jq -r '.imageId' "${owner_root}/owner.json")"
          test "$(jq -r '.Id' <<<"${inspect}")" = "${cid}"
          test "$(jq -r '.Image' <<<"${inspect}")" = "${image_id}"
          test "$(jq -r '.Config.Image' <<<"${inspect}")" = "${image_digest}"
          test "$(jq -r '.Config.Labels | length' <<<"${inspect}")" = "5"
          test "$(jq -r '.Config.Labels["com.taptime.repository"]' <<<"${inspect}")" = "taptime"
          test "$(jq -r '.Config.Labels["com.taptime.run-id"]' <<<"${inspect}")" = "${GITHUB_RUN_ID}"
          test "$(jq -r '.Config.Labels["com.taptime.run-attempt"]' <<<"${inspect}")" = "${GITHUB_RUN_ATTEMPT}"
          test "$(jq -r '.Config.Labels["com.taptime.job"]' <<<"${inspect}")" = "synthetic-android-e2e"
          test "$(jq -r '.Config.Labels["com.taptime.nonce"]' <<<"${inspect}")" = "${nonce}"
          test "$(jq -r '.labels["com.taptime.nonce"]' "${owner_root}/owner.json")" = "${nonce}"
          test "$(jq -r '.startedAt' "${owner_root}/owner.json")" = \
            "$(jq -r '.State.StartedAt' <<<"${inspect}")"
          host_pid="$(jq -r '.hostInitPid' "${owner_root}/owner.json")"
          test "${host_pid}" = "$(jq -r '.State.Pid' <<<"${inspect}")"
          test "$(read_linux_process_start_ticks "${host_pid}")" = \
            "$(jq -r '.hostProcessStartTicks' "${owner_root}/owner.json")"
          inspected_digest="$(docker image inspect "${image_id}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -v expected="${image_digest}" '$0 == expected { print; exit }')"
          test "${inspected_digest}" = "${image_digest}"

          docker rm --force "${cid}"
          if docker inspect "${cid}" >/dev/null 2>&1; then
            exit 1
          fi
          residue="$(docker ps --all --quiet \
            --filter label=com.taptime.repository=taptime \
            --filter "label=com.taptime.run-id=${GITHUB_RUN_ID}" \
            --filter "label=com.taptime.run-attempt=${GITHUB_RUN_ATTEMPT}" \
            --filter label=com.taptime.job=synthetic-android-e2e \
            --filter "label=com.taptime.nonce=${nonce}")"
          test -z "${residue}"
