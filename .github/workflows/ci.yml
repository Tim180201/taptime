      - name: Typecheck and test Mobile work reads and Project administration
        run: |
          npm run typecheck --workspace=@taptime/backend-mobile-work
          npm test --workspace=@taptime/backend-mobile-work

      - name: Typecheck C2/C3C/C3E1/C3E2/offline API production and test sources
        run: npm run typecheck --workspace=@taptime/backend-api

      - name: Test C1, C2, C3C, C3E1, C3E2, and offline API against direct PostgreSQL and local JWKS
        run: npm test --workspace=@taptime/backend-api

      - name: Build C2/C3C/C3E1/C3E2/offline backend API
        run: npm run build --workspace=@taptime/backend-api

      - name: Typecheck and test Mobile authentication, transport, enrollment, projection, and offline synchronization
        run: |
          npm run typecheck --workspace=@taptime/mobile
          npm test --workspace=@taptime/mobile

