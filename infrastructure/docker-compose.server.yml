name: taptime-prod

services:
  database:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: taptime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_installer_password
    secrets:
      - postgres_installer_password
    volumes:
      - taptime-postgres-data:/var/lib/postgresql/data
    networks:
      - taptime-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username postgres --dbname taptime
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  taptime-internal:
    name: taptime-internal
    internal: true

volumes:
  taptime-postgres-data:
    name: taptime-postgres-data

secrets:
  postgres_installer_password:
    file: ./secrets/postgres-installer-password
